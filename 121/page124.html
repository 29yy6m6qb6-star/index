<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ライブリスニング</title>

<!-- iOS ホーム画面対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ライブ音声">

<!-- レスポンシブ -->
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<!-- アイコン -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
html,body{
    margin:0;
    padding:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
    height:100%;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

p{
    opacity:0.8;
}

button{
    margin-top:20px;
    padding:15px 40px;
    font-size:22px;
    border:none;
    border-radius:16px;
    background:#2196F3;
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

button:active{
    transform:scale(0.96);
}

#level{
    width:300px;
    height:24px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:25px;
}

#bar{
    width:0%;
    height:100%;
    background:lime;
}

input[type=range]{
    width:300px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🎧 ライブリスニング</h1>
<p>ホーム画面追加対応版</p>

<button onclick="startAudio()">
開始
</button>

<p>🔊 音量</p>

<input
type="range"
id="volume"
min="0"
max="10"
step="0.1"
value="1">

<div id="level">
    <div id="bar"></div>
</div>

<script>
var audioContext;
var gainNode;

function getUserMediaCompat(
    constraints,
    success,
    error
){

    if(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
    ){

        navigator.mediaDevices
            .getUserMedia(constraints)
            .then(success)
            .catch(error);

    }else{

        var getUserMedia =
            navigator.getUserMedia ||
            navigator.webkitGetUserMedia ||
            navigator.mozGetUserMedia;

        if(!getUserMedia){
            alert("この端末は未対応です");
            return;
        }

        getUserMedia.call(
            navigator,
            constraints,
            success,
            error
        );
    }
}

function startAudio(){

    window.AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    audioContext =
        new AudioContext();

    getUserMediaCompat(

        { audio:true },

        function(stream){

            var source =
                audioContext
                .createMediaStreamSource(stream);

            var analyser =
                audioContext
                .createAnalyser();

            gainNode =
                audioContext
                .createGain();

            analyser.fftSize = 256;

            source.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(
                audioContext.destination
            );

            gainNode.gain.value = 1;

            var slider =
                document.getElementById("volume");

            slider.addEventListener(
                "input",
                function(){
                    gainNode.gain.value =
                        parseFloat(slider.value);
                },
                false
            );

            var data =
                new Uint8Array(
                    analyser.frequencyBinCount
                );

            var bar =
                document.getElementById("bar");

            function update(){

                analyser.getByteFrequencyData(data);

                var total = 0;

                for(
                    var i=0;
                    i<data.length;
                    i++
                ){
                    total += data[i];
                }

                var volume =
                    total / data.length;

                var width =
                    Math.min(volume / 2,100);

                bar.style.width =
                    width + "%";

                requestAnimationFrame(update);
            }

            update();
        },

        function(err){
            alert(
                "マイク取得失敗: " + err
            );
        }
    );
}
</script>

</body>
</html>
