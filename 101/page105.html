<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>文字</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    #text {
      margin-top: 20px;
      font-size: 30px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

<input type="text" id="textInput" placeholder="文字を入力してください Please enter characters">

<select id="fontSelect">
  <optgroup label="Japanese">
    <option value="'Klee One', sans-serif">Klee One</option>
    <option value="sans-serif" selected>sans-serif</option>
    <option value="serif">serif</option>
  </optgroup>

  <optgroup label="English">
    <option value="cursive">cursive</option>
    <option value="monospace">monospace</option>
  </optgroup>
</select>

<br><br>

<div id="text">文字を入力してください Please enter characters</div>

<script>
  // Safari 9対応（var + function）
  var text = document.getElementById('text');
  var textInput = document.getElementById('textInput');
  var fontSelect = document.getElementById('fontSelect');

  // テキスト変更
  textInput.addEventListener('input', function () {
    if (textInput.value === '') {
      text.innerText = '文字を入力してください Please enter characters';
    } else {
      text.innerText = textInput.value;
    }
  });

  // フォント変更
  fontSelect.addEventListener('change', function () {
    text.style.fontFamily = fontSelect.value;
  });
</script>

</body>
</html>
