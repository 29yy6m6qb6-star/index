<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>シンプルカウントダウンタイマー</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      background: canvas;
      color: canvastext;
    }
    .card {
      width: min(720px, 92vw);
      border: 1px solid color-mix(in oklab, canvastext 20%, transparent);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 24px color-mix(in oklab, canvastext 15%, transparent);
      background: canvas;
    }
    h1 { margin: 0 0 12px; font-size: 1.25rem; }
    .inputs, .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .inputs input {
      width: 5.5rem; padding: 10px; font-size: 1rem; text-align: center;
      border: 1px solid color-mix(in oklab, canvastext 20%, transparent);
      border-radius: 8px; background: canvas; color: canvastext;
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.2rem, 6vw, 4rem);
      letter-spacing: 2px;
      text-align: center;
      margin: 16px 0 12px;
    }
    button {
      padding: 10px 14px; border-radius: 999px; border: none; cursor: pointer;
      background: color-mix(in oklab, canvastext 12%, highlight);
      color: canvastext; font-weight: 600;
    }
    button.secondary { background: color-mix(in oklab, canvastext 6%, canvas); border: 1px solid color-mix(in oklab, canvastext 20%, transparent); }
    button.danger { background: #e74c3c; color: white; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .progress {
      height: 10px; width: 100%; background: color-mix(in oklab, canvastext 7%, canvas);
      border-radius: 999px; overflow: hidden; margin-top: 12px; position: relative;
    }
    .bar { height: 100%; width: 0%; background: #3ba776; transition: width .2s linear; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <main class="card" role="region" aria-label="カウントダウンタイマー">
    <h1>カウントダウンタイマー</h1>

    <section class="inputs">
      <label>分
        <input id="min" type="number" min="0" max="999" step="1" value="0" inputmode="numeric" aria-label="分">
      </label>
      <label>秒
        <input id="sec" type="number" min="0" max="59" step="1" value="30" inputmode="numeric" aria-label="秒">
      </label>
      <button id="preset-5" class="secondary" type="button">+5分</button>
      <button id="preset-1" class="secondary" type="button">+1分</button>
      <button id="clear" class="secondary" type="button">クリア</button>
    </section>

    <div class="display" aria-live="polite" aria-atomic="true" id="display">00:30</div>

    <section class="actions">
      <button id="start">スタート</button>
      <button id="pause" disabled>一時停止</button>
      <button id="resume" disabled>再開</button>
      <button id="reset" class="danger" disabled>リセット</button>
    </section>

    <div class="progress" aria-hidden="true">
      <div class="bar" id="bar"></div>
      <span class="sr-only" id="sr-progress">0%</span>
    </div>

    <audio id="beep" preload="auto">
      <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABYAZGF0YQAAAAA=" type="audio/wav">
    </audio>
  </main>

  <script>
    (() => {
      'use strict';

      const $ = (sel) => document.querySelector(sel);
      const minEl = $('#min');
      const secEl = $('#sec');
      const displayEl = $('#display');
      const barEl = $('#bar');
      const srProgress = $('#sr-progress');
      const startBtn = $('#start');
      const pauseBtn = $('#pause');
      const resumeBtn = $('#resume');
      const resetBtn = $('#reset');
      const preset5 = $('#preset-5');
      const preset1 = $('#preset-1');
      const clearBtn = $('#clear');
      const beep = $('#beep');

      let durationMs = 30_000;
      let remainingMs = durationMs;
      let endAt = null;
      let rafId = null;
      let running = false;
      let paused = false;

      function clamp(n, min, max) { return Math.min(Math.max(n, min), max); }
      function pad2(n) { return String(n).padStart(2, '0'); }
      function fmt(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${pad2(m)}:${pad2(s)}`;
      }

      function recalcDurationFromInputs() {
        const m = clamp(parseInt(minEl.value || '0', 10), 0, 999);
        const s = clamp(parseInt(secEl.value || '0', 10), 0, 59);
        minEl.value = m;
        secEl.value = s;
        durationMs = (m * 60 + s) * 1000;
        remainingMs = durationMs;
        updateDisplay(remainingMs, true);
        updateButtons('idle');
      }

      function updateDisplay(ms, force = false) {
        displayEl.textContent = fmt(ms);
        const progress = durationMs > 0 ? (1 - ms / durationMs) : 1;
        const pct = clamp(progress * 100, 0, 100);
        barEl.style.width = `${pct}%`;
        srProgress.textContent = `${Math.round(pct)}%`;
        if (force) cancelAnim();
      }

      function tick() {
        if (!running) return;
        const now = performance.now();
        remainingMs = Math.max(0, Math.round(endAt - now));
        updateDisplay(remainingMs);
        if (remainingMs <= 0) {
          finish();
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      function start() {
        if (running || durationMs <= 0) return;
        running = true;
        paused = false;
        endAt = performance.now() + remainingMs;
        updateButtons('running');
        rafId = requestAnimationFrame(tick);
      }

      function pause() {
        if (!running || paused) return;
        paused = true;
        running = false;
        cancelAnim();
        updateButtons('paused');
      }

      function resume() {
        if (running || !paused) return;
        paused = false;
        running = true;
        endAt = performance.now() + remainingMs;
        updateButtons('running');
        rafId = requestAnimationFrame(tick);
      }

      function reset() {
        running = false;
        paused = false;
        cancelAnim();
        remainingMs = durationMs;
        updateDisplay(remainingMs, true);
        updateButtons('idle');
      }

      function finish() {
        running = false;
        paused = false;
        cancelAnim();
        updateDisplay(0, true);
        updateButtons('done');
        try { beep.currentTime = 0; beep.play().catch(() => {}); } catch {}
      }

      function cancelAnim() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

      function updateButtons(state) {
        switch (state) {
          case 'running':
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
            resetBtn.disabled = false;
            minEl.disabled = true; secEl.disabled = true;
            preset5.disabled = true; preset1.disabled = true; clearBtn.disabled = true;
            break;
          case 'paused':
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            resumeBtn.disabled = false;
            resetBtn.disabled = false;
            minEl.disabled = true; secEl.disabled = true;
            preset5.disabled = true; preset1.disabled = true; clearBtn.disabled = true;
            break;
          case 'done':
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            resetBtn.disabled = false;
            minEl.disabled = false; secEl.disabled = false;
            preset5.disabled = false; preset1.disabled = false; clearBtn.disabled = false;
            break;
          case 'idle':
          default:
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            resetBtn.disabled = true;
            minEl.disabled = false; secEl.disabled = false;
            preset5.disabled = false; preset1.disabled = false; clearBtn.disabled = false;
        }
      }

      // Events
      startBtn.addEventListener('click', start);
      pauseBtn.addEventListener('click', pause);
      resumeBtn.addEventListener('click', resume);
      resetBtn.addEventListener('click', reset);
      preset5.addEventListener('click', () => {
        const total = (parseInt(minEl.value || '0', 10) * 60 + parseInt(secEl.value || '0', 10)) + 300;
        minEl.value = Math.floor(total / 60);
        secEl.value = total % 60;
        recalcDurationFromInputs();
      });
      preset1.addEventListener('click', () => {
        const total = (parseInt(minEl.value || '0', 10) * 60 + parseInt(secEl.value || '0', 10)) + 60;
        minEl.value = Math.floor(total / 60);
        secEl.value = total % 60;
        recalcDurationFromInputs();
      });
      clearBtn.addEventListener('click', () => { minEl.value = 0; secEl.value = 0; recalcDurationFromInputs(); });

      minEl.addEventListener('change', recalcDurationFromInputs);
      secEl.addEventListener('change', recalcDurationFromInputs);
      minEl.addEventListener('input', () => updateDisplay((parseInt(minEl.value || '0', 10) * 60 + parseInt(secEl.value || '0', 10)) * 1000, true));
      secEl.addEventListener('input', () => updateDisplay((parseInt(minEl.value || '0', 10) * 60 + parseInt(secEl.value || '0', 10)) * 1000, true));

      // Initialize display
      recalcDurationFromInputs();

      // Page visibility: auto-pause to keep timing accurate if tab is throttled
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && running) pause();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          if (running) pause(); else if (paused) resume(); else start();
        } else if (e.key === 'r') {
          reset();
        }
      });
    })();
  </script>
</body>
</html>
