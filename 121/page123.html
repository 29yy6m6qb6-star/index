<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ライブリスニング iOS9対応</title>

<style>
body{
    text-align:center;
    font-family:sans-serif;
    background:#111;
    color:#fff;
    padding-top:40px;
}

button{
    font-size:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#2196F3;
    color:white;
}

#level{
    width:300px;
    height:20px;
    background:#333;
    margin:20px auto;
    border-radius:10px;
    overflow:hidden;
}

#bar{
    height:100%;
    width:0%;
    background:lime;
}

input[type=range]{
    width:300px;
}
</style>
</head>
<body>

<h1>🎧 ライブリスニング</h1>
<button onclick="startAudio()">開始</button>

<p>🔊 音量</p>
<input type="range" id="volume" min="0" max="10" step="0.1" value="1">

<div id="level">
    <div id="bar"></div>
</div>

<script>
var audioContext;
var gainNode;

function getUserMediaCompat(constraints, success, error) {

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {

        navigator.mediaDevices
            .getUserMedia(constraints)
            .then(success)
            .catch(error);

    } else {

        var getUserMedia =
            navigator.getUserMedia ||
            navigator.webkitGetUserMedia ||
            navigator.mozGetUserMedia;

        if (!getUserMedia) {
            alert("getUserMedia未対応");
            return;
        }

        getUserMedia.call(navigator, constraints, success, error);
    }
}

function startAudio() {

    window.AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    audioContext = new AudioContext();

    getUserMediaCompat(
        { audio: true },

        function(stream) {

            var source =
                audioContext.createMediaStreamSource(stream);

            var analyser =
                audioContext.createAnalyser();

            gainNode =
                audioContext.createGain();

            analyser.fftSize = 256;

            source.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioContext.destination);

            gainNode.gain.value = 1;

            var volumeSlider =
                document.getElementById("volume");

            volumeSlider.addEventListener(
                "input",
                function() {
                    gainNode.gain.value =
                        parseFloat(volumeSlider.value);
                },
                false
            );

            var data =
                new Uint8Array(
                    analyser.frequencyBinCount
                );

            var bar =
                document.getElementById("bar");

            function updateLevel() {

                analyser.getByteFrequencyData(data);

                var total = 0;

                for (var i = 0; i < data.length; i++) {
                    total += data[i];
                }

                var volume =
                    total / data.length;

                var width =
                    Math.min(volume / 2, 100);

                bar.style.width =
                    width + "%";

                requestAnimationFrame(updateLevel);
            }

            updateLevel();
        },

        function(err) {
            alert("マイク取得エラー: " + err);
        }
    );
}
</script>

</body>
</html>
