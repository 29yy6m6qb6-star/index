<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢字辞典</title>
<style>
body { font-family: sans-serif; margin:20px; background:#f5f5f5; }
h1 { text-align:center; }
#search { display:block; margin:10px auto; padding:10px; width:300px; }
.kanji-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}

.kanji { font-size:40px; font-weight:bold; }
#list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;}

@media (prefers-color-scheme: dark) {
  body { background: #121212; color: #eee; }
 h1 { color: #fff; }
 #search { background: #1e1e1e; color: #fff; border: 1px solid #333;}
.kanji-card { background: #1e1e1e; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
}

</style>
</head>
<body>

<h1>📘 漢字辞典</h1>
<input type="text" id="search" placeholder="検索">
<div id="list"></div>

<!-- 🔥 データ読み込み -->
<script src="kanji-data.js"></script>

<script>
const list = document.getElementById("list");
const search = document.getElementById("search");

function display(items){
  list.innerHTML = "";
  items.forEach(k => {
    list.innerHTML += `
      <div class="kanji-card">
        <div class="kanji">${k.kanji}</div>
        <p>音読み: ${k.on}</p>
        <p>訓読み: ${k.kun}</p>
        <p>意味: ${k.meaning}</p>
      </div>
    `;
  });
}

search.addEventListener("input", () => {
  const keyword = search.value;
  const filtered = kanjiData.filter(k =>
    k.kanji.includes(keyword) ||
    k.on.includes(keyword) ||
    k.kun.includes(keyword) ||
    k.meaning.includes(keyword)
  );
  display(filtered);
});

display(kanjiData);
</script>

</body>
</html>
