<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ライブリスニング</title>
<link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="color.css">
  <link rel="stylesheet" href="style.css">
<style>
  body {
    text-align: center;
    font-family: sans-serif;
    background: #111;
    color: #fff;
  }
  button {
    font-size: 18px;
    padding: 10px 20px;
    margin-top: 20px;
  }
  #level {
    width: 300px;
    height: 20px;
    background: #333;
    margin: 20px auto;
    border-radius: 10px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0%;
    background: lime;
    transition: width 0.1s;
  }
  input[type=range] {
    width: 300px;
  }
</style>
</head>
<body>

<h1>🎧 ライブリスニング</h1>
<p>マイクの音をリアルタイムで再生します</p>

<button class="blue" onclick="start()">開始</button>

<p>🔊 音量</p>
<input type="range" id="volume" min="0" max="10" step="0.01" value="1">

<div id="level">
  <div id="bar"></div>
</div>

<script>
let gain;

async function start() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  const audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();
  gain = audioCtx.createGain();

  analyser.fftSize = 256;
  source.connect(analyser);
  analyser.connect(gain);
  gain.connect(audioCtx.destination);

  const volumeSlider = document.getElementById("volume");
  volumeSlider.oninput = () => {
    gain.gain.value = volumeSlider.value;
  };

  const data = new Uint8Array(analyser.frequencyBinCount);
  const bar = document.getElementById("bar");

  function update() {
    analyser.getByteFrequencyData(data);
    const volume = data.reduce((a,b)=>a+b) / data.length;
    bar.style.width = Math.min(volume / 2, 100) + "%";
    requestAnimationFrame(update);
  }
  update();
}
</script>

</body>
</html>
